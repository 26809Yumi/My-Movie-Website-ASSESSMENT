<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>MOVIES</h1>
        <p>Don't know what to watch? <a href="#">Click here.</a></p>
    </header>
    <main>
        <section>
            <h2>TRENDING &rarr;</h2>
            <div class="grid">
                <div class="card"><img src="./images/The Odyssey.jpeg" alt="The Odyssey"><button>The Odyssey</button></div>
                <div class="card"><img src="./images/moana.jpg" alt="Moana"><button>Moana</button></div>
                <div class="card"><img src="./Images/The invite.jpg" alt="The Invite"><button>The Invite</button></div>
                <div class="card"><img src="./images/Obssession.jpg" alt="Obssession"><button>Obssession</button></div>
                <div class="card"><img src="./images/Backrooms.jpeg" alt="Backrooms"><button>Backrooms</button></div>
                <div class="card"><img src="./images/Evil dead burn.jpg" alt="Evil Dead Burn"><button>Evil Dead Burn</button></div>
                <div class="card"><img src="./images/Project Hail Mary.jpg" alt="Project Hail Mary"><button>Project Hail Mary</button></div>
            </div>
        </section>
        <section>
            <h2>UPCOMING MOVIES/TV SHOWS IN <span>2026</span> &rarr;</h2>
            <div class="grid">
                <div class="card"><img src="./images/Spiderman - Brand New Day.jpeg" alt="Spider-man: Brand New Day"><button>Spider-man: Brand New Day</button></div>
                <div class="card"><img src="./images/Lanterns.jpg" alt="Lanterns"><button>Lanterns</button></div>
                <div class="card"><img src="./images/Ted Lasso Season 4.jpeg" alt="Ted Lasso"><button>Ted Lasso</button></div>
                <div class="card"><img src="./images/The Cat in the Hat.png" alt="The Cat in the Hat"><button>The Cat in the Hat</button></div>
                <div class="card"><img src="./images/The Hunger Games- Sunrise On The Reaping.jpeg" alt="Hunger Games: Sunrise on the Reaping"><button>Hunger Games: Sunrise on the Reaping</button></div>
                <div class="card"><img src="./images/Advengers Doomsday.webp" alt="Avengers: Doomsday"><button>Avengers: Doomsday</button></div>
                <div class="card"><img src="./images/Dune part 3.jpg" alt="Dune: Part 3"><button>Dune: Part 3</button></div>
            </div>
        </section>
    </main>
</body>
</html>
